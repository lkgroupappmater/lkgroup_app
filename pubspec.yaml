name: lkgroup_app

description: CargoFlow 무역·운송 관리 앱

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  supabase_flutter: ^2.3.0
  http: ^1.5.5

  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/company_logo_transparent.png
    - assets/images/company_logo.png

  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.otf

    - family: phetsarath_ot
      fonts:
        - asset: assets/fonts/phetsarath_ot.ttf
