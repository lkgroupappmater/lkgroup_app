name: lkgroup_app

description: CargoFlow 무역·운송 관리 앱

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  archive: ^3.6.1
  flutter:
    sdk: flutter

  supabase_flutter: ^2.17.2
  excel: ^4.0.6
  file_picker: ^12.1.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.3

  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/company_logo_transparent.png
    - assets/quotation_forms/
    - assets/statement_forms/
    - assets/images/company_logo.png
    - assets/images/bank_accounts_strip.png
    - assets/images/company_stamp.png
    - assets/images/payment_qr_thb.png
    - assets/images/payment_qr_kip.png
    - assets/images/payment_qr_usd.png

  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.otf







