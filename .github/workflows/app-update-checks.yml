name: App update checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      ota_action:
        description: 'Shorebird: check = 연결 확인, release = 최초/새 설치본, patch = 코드 패치'
        type: choice
        required: true
        default: check
        options: [check, release, patch]
permissions:
  contents: read
concurrency:
  group: app-update-checks-${{ github.ref }}
  # Never cancel a production patch halfway through publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/live_data_service.dart lib/services/app_update_service.dart lib/services/code_update_service.dart lib/widgets/code_update_panel.dart lib/main.dart lib/app.dart lib/widgets/auto_refresh_state.dart lib/widgets/app_update_banner.dart lib/widgets/app_shell.dart lib/screens/dashboard_home_screen.dart lib/screens/shipment_search_screen.dart lib/screens/cargo_management_screen.dart lib/screens/notice_list_screen.dart lib/screens/shipment_schedule_screen.dart test/auto_refresh_state_test.dart test/app_update_service_test.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/core/document_delivery_style.dart lib/core/money_format.dart lib/screens/splash_screen.dart lib/screens/quote_request_screen.dart lib/services/customer_benefit_service.dart lib/core/document_form_style.dart lib/core/document_form_painter.dart lib/core/document_text_catalog.dart lib/screens/quotation_preview_dialog.dart lib/screens/statement_preview_dialog.dart test/document_form_layout_test.dart test/document_form_render_test.dart
      - run: flutter test test/code_update_service_test.dart test/code_update_panel_test.dart test/startup_flow_test.dart test/document_delivery_style_test.dart test/money_format_test.dart test/auto_refresh_state_test.dart test/app_update_service_test.dart test/route_selection_order_test.dart test/document_form_layout_test.dart test/document_form_render_test.dart
      - name: Save rendered quotation and statement previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lkgroup-document-previews
          path: build/document-previews/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Save startup previews and resolved dependency lock
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lkgroup-startup-checks
          path: |
            build/startup-previews/*.png
            pubspec.lock
          if-no-files-found: error
          retention-days: 14
      # Compile the native Play bridge; no credentials, signing or publishing.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: lkgroup-native-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
  native-startup:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lkgroup-native-test-apk
          path: build/native-apk
      - run: python3 -m pip install Pillow==12.1.1
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the actual Android 12 splash in light and dark mode
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_2
          script: python3 tool/check_native_startup.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lkgroup-native-startup
          path: build/native-startup/*.png
          if-no-files-found: error
          retention-days: 14
  shorebird-status:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.inspect.outputs.ready }}
      version: ${{ steps.inspect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Shorebird access and release prerequisites
        id: inspect
        env:
          OTA_ACTION: ${{ github.event_name == 'push' && 'patch' || inputs.ota_action }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          APP_DART_DEFINES: ${{ secrets.APP_DART_DEFINES }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/shorebird_ci.py inspect --action "$OTA_ACTION"
  shorebird-deploy:
    needs: [validate, native-startup, shorebird-status]
    if: needs.shorebird-status.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: lkgroup-shorebird-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Shorebird CLI
        uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1
        with:
          cache: true
      - name: Publish the verified Android release or patch
        env:
          OTA_ACTION: ${{ github.event_name == 'push' && 'patch' || inputs.ota_action }}
          GH_TOKEN: ${{ github.token }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          APP_DART_DEFINES: ${{ secrets.APP_DART_DEFINES }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/shorebird_ci.py publish --action "$OTA_ACTION"
      - name: Save the first-install APK and Play Store AAB
        if: github.event_name == 'workflow_dispatch' && inputs.ota_action == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lkgroup-shorebird-android-${{ needs.shorebird-status.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

