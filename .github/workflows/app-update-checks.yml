name: App update checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      ota_action:
        description: 'Shorebird: check = 연결 확인, release = 최초/새 설치본, patch = 코드 패치'
        type: choice
        required: true
        default: check
        options: [check, release, patch]
permissions:
  contents: read
concurrency:
  group: app-update-checks-${{ github.ref }}
  # Never cancel a production patch halfway through publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/services/live_data_service.dart lib/services/app_update_service.dart lib/widgets/auto_refresh_state.dart lib/widgets/app_update_banner.dart lib/widgets/app_shell.dart lib/screens/dashboard_home_screen.dart lib/screens/shipment_search_screen.dart lib/screens/cargo_management_screen.dart lib/screens/notice_list_screen.dart lib/screens/shipment_schedule_screen.dart test/auto_refresh_state_test.dart test/app_update_service_test.dart
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/core/document_form_style.dart lib/core/document_form_painter.dart lib/core/document_text_catalog.dart lib/screens/quotation_preview_dialog.dart lib/screens/statement_preview_dialog.dart test/document_form_layout_test.dart test/document_form_render_test.dart
      - run: flutter test test/auto_refresh_state_test.dart test/app_update_service_test.dart test/route_selection_order_test.dart test/document_form_layout_test.dart test/document_form_render_test.dart
      - name: Save rendered quotation and statement previews
        uses: actions/upload-artifact@v4
        with:
          name: lkgroup-document-previews
          path: build/document-previews/*.png
          if-no-files-found: error
          retention-days: 14
      # Compile the native Play bridge; no credentials, signing or publishing.
      - run: flutter build apk --debug
  shorebird-status:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.inspect.outputs.ready }}
      version: ${{ steps.inspect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Shorebird access and release prerequisites
        id: inspect
        env:
          OTA_ACTION: ${{ github.event_name == 'push' && 'patch' || inputs.ota_action }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          APP_DART_DEFINES: ${{ secrets.APP_DART_DEFINES }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/shorebird_ci.py inspect --action "$OTA_ACTION"
  shorebird-deploy:
    needs: [validate, shorebird-status]
    if: needs.shorebird-status.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: lkgroup-shorebird-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Shorebird CLI
        uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1
        with:
          cache: true
      - name: Publish the verified Android release or patch
        env:
          OTA_ACTION: ${{ github.event_name == 'push' && 'patch' || inputs.ota_action }}
          GH_TOKEN: ${{ github.token }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          APP_DART_DEFINES: ${{ secrets.APP_DART_DEFINES }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tool/shorebird_ci.py publish --action "$OTA_ACTION"
      - name: Save the first-install APK and Play Store AAB
        if: github.event_name == 'workflow_dispatch' && inputs.ota_action == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lkgroup-shorebird-android-${{ needs.shorebird-status.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

